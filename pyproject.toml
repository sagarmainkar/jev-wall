[project]
name = "jevwall"
version = "0.1.0"
description = "A live visual test of TypeSafe AI's Jev model as a prompt-injection guardrail"
authors = [
    { name = "Sagar Mainkar", email = "sagar.mainkar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.7.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
jevwall = "jevwall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "PTH", "B"]
